name: cisco-image

on:
  push:
    branches: [main]
    paths: [cisco/Dockerfile, .github/workflows/cisco-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: cisco
          push: true
          tags: ghcr.io/${{ github.repository }}/cisco:latest
